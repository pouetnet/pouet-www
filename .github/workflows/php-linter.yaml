# Also called by the other pouet-* site repos (workflow_call), so every site
# gets the same lint. Their check is named "php / lint".
on:
  push:
    branches:
      - master
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          # Same as prod: without it, code after a bare "<?" is never parsed.
          ini-values: short_open_tag=On
      - name: Lint PHP files
        # Tracked files only (skips the sceneid3 submodule); fails if any file fails
        run: git ls-files -z '*.php' | xargs -0 -r -n1 php -l
