on:
  push:
    branches:
      - master
    # Keep in sync with the file list in the changes job
    paths:
      - pouet.sql
      - .github/workflows/mysql.yaml
  pull_request:

permissions:
  contents: read

jobs:
  # test-mysql is a required check, so a `paths` filter on pull_request would
  # leave it waiting forever on PRs that don't touch the schema. Skip the job
  # instead: a skipped job passes the check.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      mysql: ${{ steps.files.outputs.mysql }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate \
            --jq '.[] | .filename, .previous_filename // empty')
          if grep -qxF -e pouet.sql -e .github/workflows/mysql.yaml <<< "$files"; then
            echo mysql=true >> "$GITHUB_OUTPUT"
          else
            echo mysql=false >> "$GITHUB_OUTPUT"
          fi

  test-mysql:
    needs: changes
    # Runs on push (changes is skipped there) and if changes failed, so only a
    # PR known not to touch the schema skips it
    if: ${{ !cancelled() && needs.changes.outputs.mysql != 'false' }}
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mariadb:10.11.11
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: pouet
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
      - uses: actions/checkout@v7
      - name: Load DDL
        run: mysql -h 127.0.0.1 -u root -proot pouet < pouet.sql
      - name: Verify Tables
        run: mysql -h 127.0.0.1 -u root -proot pouet -e "SHOW TABLES;"
